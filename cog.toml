ignore_merge_commits = true
branch_whitelist = ["master", "main"]
skip_ci = "[skip ci]"

generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
monorepo_version_separator = "-"

pre_bump_hooks = ["uv lock --no-upgrade"]

post_bump_hooks = [
    "git push",
    "git push --tags",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "ShawnDen-coder"
repository = "agentkit"
package_template = "remote"

[packages.agentkit-protocol]
path = "packages/agentkit-protocol"
public_api = true
changelog_path = "packages/agentkit-protocol/CHANGELOG.md"
pre_bump_hooks = [
    "uv version --package agentkit-protocol {{version}}",
]

[packages.agentkit-runtime]
path = "packages/agentkit-runtime"
public_api = true
changelog_path = "packages/agentkit-runtime/CHANGELOG.md"
pre_bump_hooks = [
    "uv version --package agentkit-runtime {{version}}",
]
