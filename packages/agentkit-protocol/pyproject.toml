[project]
name = "agentkit-protocol"
version = "0.1.0"
description = "AgentKit - domain-neutral protocol core (SSE events, Component/ComponentSchema envelope, ComponentAdapter Protocol, verb catalogue, testing DSL)"
authors = [{name = "shawndeng", email = "shawndeng1109@qq.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.14.99"
dependencies = [
    "pydantic>=2.6",
    "xxhash>=3",
]

[project.urls]
Homepage = "https://github.com/ShawnDen-coder/agentkit"
Repository = "https://github.com/ShawnDen-coder/agentkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit_protocol"]
