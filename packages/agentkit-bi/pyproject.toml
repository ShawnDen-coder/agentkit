[project]
name = "agentkit-bi"
version = "0.1.0"
description = "AgentKit - BI profile (BiSemanticModel, chart artifact, BI prompt builder, BiAdapter convenience base)"
authors = [{name = "shawndeng", email = "shawndeng1109@qq.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.14.99"
dependencies = [
    "agentkit-core",
]

[project.urls]
Homepage = "https://github.com/ShawnDen-coder/agentkit"
Repository = "https://github.com/ShawnDen-coder/agentkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit_bi"]

[tool.uv.sources]
agentkit-core = { workspace = true }
